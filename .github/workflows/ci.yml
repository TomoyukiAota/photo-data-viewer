name: CI

on:
  push:
    branches:
      - '**' # matches every branch
  pull_request:
    branches:
      - main

env:
  NEXT_TELEMETRY_DISABLED: 1
  NEXT_PUBLIC_GOOGLE_ANALYTICS_ID: ""

jobs:
  test:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [macOS-latest, ubuntu-latest, windows-latest]
      fail-fast: false

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install Node.js with bundled npm using mise
        uses: jdx/mise-action@v5.2.4
        with:
          version: 2026.10.24

      - name: Show runtime versions
        run: |
          node --version
          npm --version

      - name: npm ci
        run: npm ci

      - name: npm run lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:ci

      - name: npm run build
        run: npm run build

      - name: Build embedded application
        run: npm run build:plm

      - name: Install browser for functional regression tests
        run: npx playwright install --with-deps chromium

      - name: Browser regression tests
        run: npm run test:e2e

      - name: Development-mode regression smoke test
        run: npm run test:e2e
        env:
          PDV_DEV: 1

      - name: Upload the browser tests' results of a failure
        # Playwright writes there what a failed test saw: its trace, with the page's requests, console and
        # snapshots. The run keeps nothing else of a test. The attempt is in the name, as a job run again uploads
        # its own, and a name can be used once in a run.
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: browser-test-results-${{ matrix.os }}-attempt-${{ github.run_attempt }}
          path: test-results
          if-no-files-found: ignore
